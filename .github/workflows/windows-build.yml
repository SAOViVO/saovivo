name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - run: npm run dist:installer
      - uses: actions/upload-artifact@v4
        with:
          name: SAOViVO-Windows-${{ github.ref_name }}
          path: |
            dist/*.exe
          if-no-files-found: error
